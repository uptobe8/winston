name: Build Santuario Winston APK

on:
  pull_request:
    branches: [main]
    paths:
      - "capacitor-mobile/**"
      - ".github/workflows/build-winston-apk.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
      - name: Build installable APK
        run: cd android && ./gradlew assembleDebug --stacktrace
      - name: Package outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Santuario-Winston-v34-debug.apk
          zip -qr dist/Santuario-Winston-Android-Source.zip android
          cp ACCESO.txt dist/ACCESO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Santuario-Winston-APK-v34
          path: capacitor-mobile/dist/*
          if-no-files-found: error
          retention-days: 30
